spring:
  config:
    name: s-pay-mall-mvc
  profiles:
    #    active: prod
#    active: dev
    active: test
  # Spring Boot 2.6+ 需要设置为 ant_path_matcher 兼容 Springfox
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# Knife4j API文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: cn.bugstack.trigger.http

# Knife4j 增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn

