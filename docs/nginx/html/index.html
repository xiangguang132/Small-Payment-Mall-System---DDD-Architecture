<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品下单支付页</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f7f7f7;
        text-align: center; /* 添加居中对齐 */
    }
    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .product-info {
        margin-bottom: 20px;
        border: 1px solid #ddd; /* 添加边框 */
        padding: 10px; /* 添加内边距 */
        text-align: center; /* 添加居中对齐 */
    }
    .product-info h2 {
        margin: 0;
        margin-bottom: 5px;
    }
    .product-info p {
        font-size: 36px; /* 加大字体 */
        font-weight: bold; /* 加粗字体 */
        color: red; /* 字体颜色改为红色 */
        margin: 0; /* 移除默认的margin */
        margin-top: 20px;
    }
    .order-button {
        display: block;
        width: calc(100% - 40px); /* 减去padding的宽度 */
        padding: 10px;
        margin: 10px auto; /* 添加自动外边距实现居中 */
        font-size: 16px;
        color: #fff;
        background-color: #007bff;
        border: none;
        cursor: pointer;
        border-radius: 20px; /* 添加圆角 */
    }
    .order-button:hover {
        background-color: #0056b3;
    }
    .account-info {
        font-size: 12px; /* 设置字体大小为9号 */
        text-align: center; /* 居中对齐 */
        display: block; /* 使span表现得像块级元素 */
        margin: 10px 0; /* 添加上下外边距 */
    }
    .auth-bar {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 12px 0 6px;
    }
    .secondary-button {
        display: block;
        padding: 10px 14px;
        font-size: 14px;
        color: #333;
        background-color: #e9ecef;
        border: 1px solid #ced4da;
        cursor: pointer;
        border-radius: 20px;
    }
    .secondary-button:hover {
        background-color: #dde2e6;
    }
    .status-line {
        margin: 10px 0 0;
        font-size: 13px;
        color: #555;
    }
</style>
</head>
<body>
<div class="container">
    <div class="product-info">
        <h2>美女程序员 - 同款机械键盘</h2>

        <img width="350" src="images/sku-keyboard-001.png"/>
        <p>价格：¥1.68</p>
    </div>
    <div class="auth-bar">
        <button id="logoutButton" class="secondary-button">退出登录</button>
    </div>
    <button id="orderButton" class="order-button">立即下单「沙箱支付」</button>
    <p id="authStatus" class="status-line"></p>
    <span class="account-info">测试账号：kvhmoj3832@sandbox.com 密码：111111 支付：111111</span>
</div>

<script>
function setCookie(name, value, days) {
    const date = new Date();
    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
    const expires = "expires=" + date.toUTCString();
    document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/";
}

function removeCookie(name) {
    document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
}

function getLoginToken() {
    const localToken = localStorage.getItem("loginToken") || "";
    if (localToken) {
        return localToken;
    }

    const cookieToken = getCookie("loginToken");
    return cookieToken || "";
}

function getCookie(name) {
    let cookieArr = document.cookie.split(";");
    for (let i = 0; i < cookieArr.length; i++) {
        let cookiePair = cookieArr[i].split("=");
        if (name === cookiePair[0].trim()) {
            return decodeURIComponent(cookiePair[1] || "");
        }
    }
    return "";
}

function renderAuthStatus() {
    const statusEl = document.getElementById('authStatus');
    const token = getLoginToken();
    console.log('index token:', token);
    statusEl.textContent = token ? '当前状态：已登录，可以直接下单测试 JWT 鉴权。' : '当前状态：未登录，点击下单会直接触发后端 401。';
}

document.getElementById('logoutButton').addEventListener('click', function() {
    localStorage.removeItem('loginToken');
    removeCookie('loginToken');
    renderAuthStatus();
    console.info('logout success');
});

document.getElementById('orderButton').addEventListener('click', function() {
    var loginToken = getLoginToken();
    console.log("loginToken ready:", loginToken);

    var productId = "100010090091";
    var url = '/api/v1/alipay/lock_pay_order';

    var requestBody = {
        productId: productId
    };

    var headers = {
        'Content-Type': 'application/json'
    };
    if (loginToken) {
        headers['Authorization'] = 'Bearer ' + loginToken;
    }

    fetch(url, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(requestBody) // 将请求体转换为JSON字符串
    })
    .then(response => response.json()) // 解析JSON格式的响应
    .then(json => {
        if (Number(json.code) === 200) {
            var formHtml = json.data.payUrl; // 新接口返回结构化响应，payUrl 在 data 对象里
            document.body.innerHTML += formHtml; // 将表单添加到页面上
            document.forms[0].submit(); // 自动提交表单
        } else {
            console.error('Error:', json.info, json); // 输出错误信息和完整响应
        }
    })
    .catch(error => console.error('Error:', error));
});

renderAuthStatus();
</script>
</body>
</html>
